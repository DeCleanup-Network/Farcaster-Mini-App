# Dependabot Configuration
# Automated dependency security updates
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Open pull requests for security and version updates
    open-pull-requests-limit: 10
    # Group updates to reduce PR noise
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Labels to apply to PRs
    labels:
      - "dependencies"
      - "automated"
    # Commit message
    commit-message:
      prefix: "chore"
      include: "scope"
    # Ignore specific dependencies (if needed)
    ignore:
      # Example: Ignore major version updates for specific packages
      # - dependency-name: "package-name"
      #   update-types: ["version-update:semver-major"]
    
  # Enable version updates for GitHub Actions (if using)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"

